
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayder Kuyumculuk Fiyat Listesi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#f1d58a;font-family:Arial,sans-serif}
header{text-align:center;padding:22px 12px 14px;border-bottom:2px solid #b79748}
.brand{font-size:clamp(27px,4vw,48px);font-weight:900;letter-spacing:3px}
.owner{color:#ddd;font-size:14px;margin-top:7px}
.clock{color:#d7bd77;margin-top:9px;font-size:clamp(14px,1.8vw,20px)}
main{width:96%;max-width:1500px;margin:20px auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{background:#a98737;color:#111;padding:15px 8px;font-size:clamp(13px,1.7vw,23px);text-align:center}
th:first-child{text-align:left;width:48%}
td{padding:12px 8px;border-bottom:1px solid #514426;text-align:center;font-size:clamp(16px,2vw,28px)}
.product{display:flex;align-items:center;gap:13px;text-align:left}
.product img{width:clamp(52px,8vw,100px);height:clamp(52px,8vw,100px);object-fit:contain;border-radius:7px;background:#fff}
.name{font-weight:bold;color:#f5dda0;font-size:clamp(15px,2vw,27px)}
.sub{color:#aaa;font-size:clamp(11px,1.2vw,16px);margin-top:5px}
.price{font-weight:bold;color:#ffe39a;white-space:nowrap}
.no-sale{display:inline-block;color:#ffb4a8;font-size:clamp(12px,1.5vw,20px);font-weight:bold}
footer{text-align:center;color:#bba568;padding:14px;font-size:13px}
@media(max-width:600px){main{width:99%}th,td{padding:9px 4px}.product{gap:6px}th:first-child{width:45%}.product img{width:42px;height:42px}}
</style>
</head>
<body>
<header>
  <div class="brand">AYDER KUYUMCULUK</div>
  <div class="owner">Aydın BALİ</div>
  <div class="clock" id="clock">Fiyat Listesi</div>
</header>

<main>
<table>
<thead>
<tr>
<th>ÜRÜN</th>
<th>ALIŞ</th>
<th>SATIŞ</th>
</tr>
</thead>
<tbody id="prices">
<tr><td colspan="3">Fiyatlar yükleniyor...</td></tr>
</tbody>
</table>
</main>
<footer>Güncel fiyatlar otomatik yenilenir · Ayder Kuyumculuk</footer>

<script>
const SUPABASE_URL = "https://hskoulicnsrdeqqdwagi.supabase.co";
const SUPABASE_KEY = "sb_publishable_9ONcsJU94TGz4eo1ZQ4H_Q_a28u5dxK";

const money = value => new Intl.NumberFormat("tr-TR", {
  style:"currency", currency:"TRY",
  maximumFractionDigits:0
}).format(value);

function clock(){
  document.getElementById("clock").textContent =
    new Date().toLocaleString("tr-TR",{
      day:"2-digit",month:"2-digit",year:"numeric",
      hour:"2-digit",minute:"2-digit",second:"2-digit"
    });
}
clock();
setInterval(clock,1000);

async function getTable(path){
  const response = await fetch(SUPABASE_URL + "/rest/v1/" + path,{
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY
    },
    cache:"no-store"
  });
  if(!response.ok) throw new Error("Fiyat verileri okunamadı: "+response.status);
  return await response.json();
}

function row(name,sub,buy,sell,image,noSale=false){
  return `<tr>
    <td><div class="product">
      <img src="${image}" alt="${name}">
      <div><div class="name">${name}</div><div class="sub">${sub}</div></div>
    </div></td>
    <td class="price">${money(buy)}</td>
    <td>${noSale?'<span class="no-sale">SATIŞ YOK</span>':'<span class="price">'+money(sell)+'</span>'}</td>
  </tr>`;
}

const images = {
  bracelet:"https://images.unsplash.com/photo-1611652022419-a9419f74343d?auto=format&fit=crop&w=250&q=80",
  full:"https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=250&q=80",
  half:"https://images.unsplash.com/photo-1610375461369-d613b564f4c4?auto=format&fit=crop&w=250&q=80",
  quarter:"https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=250&q=80",
  has:"https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=250&q=80"
};

async function updatePrices(){
  try{
    const [priceRows,formulaRows] = await Promise.all([
      getTable("gold_prices?select=has_buy,has_sell&limit=1"),
      getTable("gold_formula_settings?select=*&id=eq.1")
    ]);

    if(!priceRows.length || !formulaRows.length){
      throw new Error("Fiyat veya formül kaydı bulunamadı.");
    }

    const p = priceRows[0];
    const f = formulaRows[0];

    const hasBuy = Number(p.has_buy);
    const hasSell = Number(p.has_sell);

    const braceletBuy = hasBuy * Number(f.bracelet_buy);
    const braceletSell = hasSell * Number(f.bracelet_sell);

    const fullBuy = hasBuy * Number(f.full_buy_factor) * Number(f.full_buy_multiplier);
    const fullSell = hasSell * Number(f.full_sell_factor) * Number(f.full_sell_multiplier);

    const halfBuy = fullBuy / Number(f.half_buy_divisor);
    const halfSell = fullSell / Number(f.half_sell_divisor);
    const quarterBuy = fullBuy / Number(f.quarter_buy_divisor);
    const quarterSell = fullSell / Number(f.quarter_sell_divisor);

    const has24Buy = hasBuy * Number(f.has_buy_multiplier);
    const has24Sell = hasSell * Number(f.has_sell_multiplier);

    const handledFullBuy =
      (hasBuy - Number(f.handled_deduction)) *
      Number(f.handled_buy_multiplier) *
      Number(f.handled_full_multiplier);

    const handledHalfBuy = handledFullBuy / 2;
    const handledQuarterBuy = handledFullBuy / 4;

    const html = [
      row("22 Ayar Bilezik","Gram fiyatı",braceletBuy,braceletSell,images.bracelet),
      row("Tam Altın Darphane","Adet fiyatı",fullBuy,fullSell,images.full),
      row("Yarım Altın Darphane","Adet fiyatı",halfBuy,halfSell,images.half),
      row("Çeyrek Altın Darphane","Adet fiyatı",quarterBuy,quarterSell,images.quarter),
      row("24 Ayar Has Altın","Gram fiyatı",has24Buy,has24Sell,images.has),
      row("Tam Altın Kulplu","Alış fiyatı",handledFullBuy,0,images.full,true),
      row("Yarım Altın Kulplu","Alış fiyatı",handledHalfBuy,0,images.half,true),
      row("Çeyrek Altın Kulplu","Alış fiyatı",handledQuarterBuy,0,images.quarter,true)
    ].join("");

    document.getElementById("prices").innerHTML = html;
  }catch(error){
    document.getElementById("prices").innerHTML =
      '<tr><td colspan="3">Fiyatlar alınamadı. İnternet bağlantısını kontrol edin.</td></tr>';
    console.error(error);
  }
}

updatePrices();
setInterval(updatePrices,5000);
</script>
</body>
</html>
