
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayder Kuyumculuk Yönetim Paneli</title>
<style>
body{margin:0;background:#111;color:#f1d17a;font-family:Arial,sans-serif;padding:18px}
main{max-width:650px;margin:auto}
h1{text-align:center;font-size:25px}
h2{font-size:19px;border-bottom:1px solid #a98737;padding-bottom:8px;margin-top:28px}
p{color:#ddd}
label{display:block;margin-top:14px;color:#f5e6b2}
input{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border-radius:7px;border:1px solid #9b7b31;background:#222;color:white;font-size:17px}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:8px;background:#d7b65d;color:#17130a;font-weight:bold;font-size:17px}
.small{font-size:13px;color:#bbb}
#panel{display:none}
#status{white-space:pre-wrap;margin-top:16px;color:#fff}
</style>
</head>
<body>
<main>
<h1>AYDER KUYUMCULUK</h1>
<p style="text-align:center">Fiyat ve Formül Yönetim Paneli</p>

<section id="login">
<h2>Yönetici Girişi</h2>
<label>E-posta</label>
<input id="email" type="email" autocomplete="username" placeholder="E-posta adresiniz">
<label>Şifre</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Supabase şifreniz">
<button id="loginBtn" onclick="login()">Giriş Yap</button>
</section>

<section id="panel">
<h2>Has Altın Fiyatları</h2>
<label>Has alış fiyatı (TL)</label>
<input id="has_buy" type="number" step="0.01">
<label>Has satış fiyatı (TL)</label>
<input id="has_sell" type="number" step="0.01">

<h2>22 Ayar Bilezik</h2>
<label>Bilezik alış çarpanı</label>
<input id="bracelet_buy" type="number" step="0.001">
<label>Bilezik satış çarpanı</label>
<input id="bracelet_sell" type="number" step="0.001">

<h2>Tam, Yarım ve Çeyrek Altın</h2>
<label>Tam altın çarpanı (alış ve satış)</label>
<input id="full_multiplier" type="number" step="0.001">
<label>Yarım altın bölme sayısı</label>
<input id="half_divisor" type="number" step="0.001">
<label>Çeyrek altın bölme sayısı</label>
<input id="quarter_divisor" type="number" step="0.001">

<h2>24 Ayar Has Altın</h2>
<label>Has alış çarpanı</label>
<input id="has_buy_multiplier" type="number" step="0.001">
<label>Has satış çarpanı</label>
<input id="has_sell_multiplier" type="number" step="0.001">

<h2>Kulplu Altın Alış Hesabı</h2>
<label>Has fiyatından düşülecek tutar (TL)</label>
<input id="handled_deduction" type="number" step="0.01">
<label>Kulplu altın alış çarpanı</label>
<input id="handled_buy_multiplier" type="number" step="0.001">
<label>Kulplu tam altın çarpanı</label>
<input id="handled_full_multiplier" type="number" step="0.001">

<button id="saveBtn" onclick="saveAll()">Tüm Değişiklikleri Kaydet</button>
<p class="small">Kaydettiğinde TV ekranı fiyatları yaklaşık 5 saniye içinde yeniler. Kulplu altınlarda satış kapalı kalır.</p>
</section>

<div id="status"></div>
</main>

<script>
const SUPABASE_URL = "https://hskoulicnsrdeqqdwagi.supabase.co";
const SUPABASE_KEY = "sb_publishable_9ONcsJU94TGz4eo1ZQ4H_Q_a28u5dxK";

let accessToken = "";
let priceRowId = null;

const formulaFields = [
  "bracelet_buy","bracelet_sell","full_multiplier",
  "half_divisor","quarter_divisor","has_buy_multiplier",
  "has_sell_multiplier","handled_deduction",
  "handled_buy_multiplier","handled_full_multiplier"
];

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

function headers(token) {
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + (token || SUPABASE_KEY),
    "Content-Type": "application/json"
  };
}

async function api(path, options = {}, token = "") {
  const response = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    ...options,
    headers: {...headers(token), ...(options.headers || {})}
  });
  if (!response.ok) {
    const detail = await response.text();
    throw new Error(detail || ("İstek başarısız: " + response.status));
  }
  if (response.status === 204) return null;
  const text = await response.text();
  return text ? JSON.parse(text) : null;
}

function readNumber(id) {
  const raw = document.getElementById(id).value.trim().replace(",", ".");
  const value = Number(raw);
  if (raw === "" || !Number.isFinite(value)) {
    throw new Error(id + " alanına geçerli bir sayı yaz.");
  }
  return value;
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const button = document.getElementById("loginBtn");
  button.disabled = true;
  setStatus("Giriş yapılıyor...");
  try {
    const response = await fetch(
      SUPABASE_URL + "/auth/v1/token?grant_type=password",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({email, password})
      }
    );
    const result = await response.json();
    if (!response.ok) throw new Error(result.msg || result.message || "Giriş başarısız. E-posta ve şifreni kontrol et.");
    accessToken = result.access_token;

    const prices = await api("gold_prices?select=id,has_buy,has_sell&limit=1", {}, accessToken);
    if (!prices || !prices.length) throw new Error("Has fiyat satırı bulunamadı. gold_prices tablosunu kontrol etmek gerekiyor.");
    priceRowId = prices[0].id;
    document.getElementById("has_buy").value = prices[0].has_buy;
    document.getElementById("has_sell").value = prices[0].has_sell;

    const formulas = await api("gold_formula_settings?select=*&id=eq.1", {}, accessToken);
    if (!formulas || !formulas.length) throw new Error("Formül ayar satırı bulunamadı.");
    formulaFields.forEach(field => {
      document.getElementById(field).value = formulas[0][field];
    });

    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";
    setStatus("Giriş başarılı. Fiyat ve oranları değiştirebilirsin.");
  } catch (error) {
    setStatus("Hata: " + error.message);
  } finally {
    button.disabled = false;
  }
}

async function saveAll() {
  const button = document.getElementById("saveBtn");
  button.disabled = true;
  setStatus("Değişiklikler kaydediliyor...");
  try {
    const buy = readNumber("has_buy");
    const sell = readNumber("has_sell");
    if (buy <= 0 || sell <= 0) throw new Error("Has fiyatları sıfırdan büyük olmalı.");

    const formulas = {};
    formulaFields.forEach(field => formulas[field] = readNumber(field));
    if (formulas.half_divisor <= 0 || formulas.quarter_divisor <= 0) {
      throw new Error("Yarım ve çeyrek bölme sayıları sıfırdan büyük olmalı.");
    }
    if (formulas.full_multiplier <= 0 || formulas.handled_full_multiplier <= 0) {
      throw new Error("Altın çarpanları sıfırdan büyük olmalı.");
    }

    await api("gold_prices?id=eq." + encodeURIComponent(priceRowId), {
      method: "PATCH",
      headers: {"Prefer": "return=minimal"},
      body: JSON.stringify({has_buy: buy, has_sell: sell})
    }, accessToken);

    await api("gold_formula_settings?id=eq.1", {
      method: "PATCH",
      headers: {"Prefer": "return=minimal"},
      body: JSON.stringify({...formulas, updated_at: new Date().toISOString()})
    }, accessToken);

    setStatus("Kaydetme işlemi tamamlandı. TV ekranının güncellenmesi birkaç saniye sürebilir.");
  } catch (error) {
    setStatus("Hata: " + error.message + "\nFiyat ve formül kayıtlarını kontrol et.");
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
