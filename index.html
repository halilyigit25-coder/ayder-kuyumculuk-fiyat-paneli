
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayder Kuyumculuk - Yönetim</title>
<style>
body{margin:0;background:#101010;color:#f0cc78;font-family:Arial,sans-serif;padding:22px}
main{max-width:480px;margin:auto}
h1{text-align:center;font-size:28px}
p{text-align:center;color:#ddd}
label{display:block;margin:18px 0 7px}
input{box-sizing:border-box;width:100%;padding:14px;border-radius:8px;border:1px solid #b99548;background:#222;color:white;font-size:17px}
button{width:100%;padding:14px;margin-top:16px;background:#d9b35d;color:#111;border:0;border-radius:8px;font-weight:bold;font-size:16px}
.card{background:#1c1c1c;padding:20px;border:1px solid #705a2e;border-radius:12px;margin-top:20px}
#status{white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>AYDER KUYUMCULUK</h1>
<p>Fiyat Yönetim Paneli</p>
<div class="card">
<h3>Yetkili Girişi</h3>
<label>E-posta adresi</label>
<input id="email" type="email" autocomplete="username" placeholder="Supabase kullanıcı e-postası">
<label>Şifre</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Şifreniz">
<button onclick="login()">Giriş Yap</button>
</div>
<div class="card" id="panel" style="display:none">
<h3>Has Altın Fiyatları</h3>
<label>Has alış (TL/gram)</label>
<input id="buy" type="number" min="0" step="0.01">
<label>Has satış (TL/gram)</label>
<input id="sell" type="number" min="0" step="0.01">
<button onclick="savePrices()">Fiyatları Kaydet</button>
</div>
<div class="card"><div id="status">Giriş yaparak devam edin.</div></div>
</main>
<script>
const SUPABASE_URL = "https://hskoulicnsrdeqqdwagi.supabase.co";
const SUPABASE_KEY = "sb_publishable_9ONcsJU94TGz4eo1ZQ4H_Q_a28u5dxK";
let token = "";
let rowId = null;

async function request(path, options={}) {
  const response = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + (token || SUPABASE_KEY),
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  const data = await response.json().catch(()=>({}));
  if (!response.ok) throw new Error(data.message || data.msg || data.error_description || "İşlem başarısız. Ayarları kontrol edin.");
  return data;
}

async function login() {
  const status = document.getElementById("status");
  status.textContent = "Giriş kontrol ediliyor...";
  try {
    const result = await request("/auth/v1/token?grant_type=password", {
      method: "POST",
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      })
    });
    token = result.access_token;
    await loadPrices();
    document.getElementById("panel").style.display = "block";
    status.textContent = "Giriş başarılı. Fiyatları kontrol edip kaydedebilirsiniz.";
  } catch (e) {
    status.textContent = "Giriş yapılamadı: " + e.message;
  }
}

async function loadPrices() {
  const rows = await request("/rest/v1/gold_prices?select=id,has_buy,has_sell&limit=1");
  if (!rows.length || rows[0].id == null) {
    throw new Error("Fiyat satırı veya satır ID'si bulunamadı. Supabase tablosunu kontrol etmek gerekiyor.");
  }
  rowId = rows[0].id;
  document.getElementById("buy").value = rows[0].has_buy ?? "";
  document.getElementById("sell").value = rows[0].has_sell ?? "";
}

async function savePrices() {
  const status = document.getElementById("status");
  const buy = Number(document.getElementById("buy").value);
  const sell = Number(document.getElementById("sell").value);
  if (!token || rowId === null) {
    status.textContent = "Önce giriş yapın.";
    return;
  }
  if (!(buy > 0) || !(sell > 0)) {
    status.textContent = "Alış ve satış fiyatlarını sıfırdan büyük girin.";
    return;
  }
  status.textContent = "Fiyatlar kaydediliyor...";
  try {
    await request("/rest/v1/gold_prices?id=eq." + encodeURIComponent(rowId), {
      method: "PATCH",
      headers: {"Prefer":"return=minimal"},
      body: JSON.stringify({has_buy:buy,has_sell:sell})
    });
    status.textContent = "Kaydetme isteği gönderildi. TV ekranını kontrol edin.";
  } catch (e) {
    status.textContent = "Kaydedilemedi: " + e.message;
  }
}
</script>
</body>
</html>
